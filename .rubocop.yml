require:
  - ./.rubocop/cops/ascii_only_source.rb

AllCops:
  SuggestExtensions: false
  TargetRubyVersion: 4.0
  NewCops: disable
  Include:
    - '**/*.lic'
    - '**/*.rb'

Layout/ClosingHeredocIndentation:
  Enabled: false

Layout/EmptyLineAfterGuardClause:
  Enabled: false

Layout/EndOfLine:
  Enabled: false

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

Layout/HashAlignment:
  EnforcedHashRocketStyle: table

Layout/HeredocIndentation:
  Enabled: false

Layout/LineLength:
  Enabled: false

Lint/MissingSuper:
  AllowedParentClasses: [Object, BaseObject, GameBase::Game]

Metrics/AbcSize:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/BlockNesting:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false
  
Metrics/ParameterLists:
  Enabled: false

Naming:
  Enabled: false

Naming/AsciiIdentifiers:
  Enabled: true

Security/Eval:
  Enabled: false
  
Security/MarshalLoad:
  Enabled: false

Style:
  Enabled: false

Style/AsciiComments:
  Enabled: true

Custom/AsciiOnlySource:
  Enabled: true

# Exact upstream Setup excerpts: retain source formatting and the unused local
# for digest-checked compatibility tests. Safety/ASCII and other lint cops run.
Layout:
  Exclude:
    - 'spec/fixtures/webui/bigshot_setup.lic'
    - 'spec/fixtures/webui/huntplan_setup.lic'

Lint/UselessAssignment:
  Exclude:
    - 'spec/fixtures/webui/huntplan_setup.lic'
