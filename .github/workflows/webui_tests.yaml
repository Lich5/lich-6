name: WebUI Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  renderer:
    name: JavaScript renderer
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: spec/webui/package-lock.json
      - run: npm ci --prefix spec/webui
      - run: npm test --prefix spec/webui

  browser:
    name: Chrome browser integration
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      BUNDLE_WITHOUT: 'vscode:profanity'
      NATIVE_BROWSER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.5.0'
          cache: npm
          cache-dependency-path: spec/webui/package-lock.json
      - run: npm ci --prefix spec/webui
      - name: Install Chrome and browser system dependencies
        working-directory: spec/webui
        run: npx --no-install playwright install --with-deps chrome
      - name: Exercise shim controls and file bootstrap
        run: bundle exec rspec spec/lib/common/script_scope_widgets_spec.rb spec/lib/common/script_scope_builder_spec.rb spec/lib/common/script_scope_builder_remaining_spec.rb spec/lib/webui/browser_integration_spec.rb --tag browser
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webui-browser-failures
          path: spec/webui/test-results/
          if-no-files-found: ignore
          retention-days: 7
