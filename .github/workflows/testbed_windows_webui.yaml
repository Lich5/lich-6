name: Testbed Windows WebUI specs

# Throwaway testbed. Runs only on testbed/** branches or by hand; never on main.
on:
  push:
    branches:
      - 'testbed/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows_webui_specs:
    name: WebUI specs on native Windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      BUNDLE_WITHOUT: 'vscode:profanity'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true
      - name: file_service_spec
        run: bundle exec rspec spec/lib/webui/file_service_spec.rb
      - name: server_transport_boundary_spec
        if: ${{ !cancelled() }}
        run: bundle exec rspec spec/lib/webui/server_transport_boundary_spec.rb
      - name: connection_outbound_queue_spec
        if: ${{ !cancelled() }}
        run: bundle exec rspec spec/lib/webui/connection_outbound_queue_spec.rb
      - name: websocket_spec
        if: ${{ !cancelled() }}
        run: bundle exec rspec spec/lib/webui/websocket_spec.rb
      - name: window_geometry_store specs
        if: ${{ !cancelled() }}
        run: bundle exec rspec spec/lib/webui/window_geometry_store_spec.rb spec/lib/webui/window_geometry_store_temp_spec.rb spec/lib/common/webui_launcher/window_geometry_store_spec.rb
      - name: launcher browser examples
        if: ${{ !cancelled() }}
        run: bundle exec rspec spec/lib/common/webui_launcher/controller_regressions_spec.rb -e "launcher browser"
      - name: real keychain fence (Win32 group)
        if: ${{ !cancelled() }}
        run: bundle exec rspec spec/lib/real_keychain_fence_spec.rb
      - name: master password and entry store specs
        if: ${{ !cancelled() }}
        run: bundle exec rspec spec/lib/common/authentication/entry_store_spec.rb spec/lib/common/cli/cli_encryption_mode_change_spec.rb spec/lib/common/webui_launcher/catalog_password_changes_spec.rb spec/lib/common/authentication/cli_password_spec.rb spec/lib/common/gui/account_manager_spec.rb spec/lib/webui/browser_launcher_spec.rb
      - name: server Fetch Metadata spec
        if: ${{ !cancelled() }}
        run: bundle exec rspec spec/lib/webui/server_spec.rb
      - name: browser path, variable and discovery spec
        if: ${{ !cancelled() }}
        run: bundle exec rspec spec/lib/webui/browser_path_spec.rb
      - name: launcher saved-path and Chromium examples
        if: ${{ !cancelled() }}
        run: bundle exec rspec spec/lib/common/webui_launcher/controller_regressions_spec.rb -e "saved browser path" -e "Chromium"
      - name: startup fatal report spec
        if: ${{ !cancelled() }}
        run: bundle exec rspec spec/lib/main/webui_startup_spec.rb
      - name: Windows-aware specs the stack touched (first Windows run)
        if: ${{ !cancelled() }}
        run: bundle exec rspec spec/lib/common/frontend_choices_spec.rb spec/lib/common/webui_launcher/catalog_integration_spec.rb spec/lib/common/webui_launcher_workflows_spec.rb spec/lib/util/memoryreleaser_spec.rb spec/lib/webui/browser_window_pending_close_spec.rb spec/lib/webui/host_service_boundary_spec.rb spec/lib/webui/monitor_geometry_spec.rb spec/lib/webui/owned_shutdown_spec.rb spec/lib/webui/window_lifecycle_spec.rb
      - name: gemcheck spec (informational; example 845 is a main-only Windows gap)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bundle exec rspec spec/lib/gemcheck_spec.rb
      - name: full spec/lib/webui
        if: ${{ !cancelled() }}
        run: bundle exec rspec spec/lib/webui
      - name: builder specs (1850:RC5, Windows CRLF reads and child supervision)
        if: ${{ !cancelled() }}
        run: bundle exec rspec spec/lib/common/script_scope_builder_spec.rb spec/lib/common/script_scope_builder_remaining_spec.rb
      - name: default WebUI acceptance spec (1853:RC18, Windows child supervision)
        if: ${{ !cancelled() }}
        run: bundle exec rspec spec/lib/main/default_webui_acceptance_spec.rb
      - name: master-password and browser specs (1841:RC29, 1834:RC41/RC42, 1838:RC8)
        if: ${{ !cancelled() }}
        run: bundle exec rspec spec/lib/common/gui/master_password_manager_spec.rb spec/lib/common/authentication/cli_password_spec.rb spec/lib/common/cli/cli_encryption_mode_change_spec.rb spec/lib/common/webui_launcher/controller_regressions_spec.rb
      - name: workflow classification test on a CRLF checkout (1852:RC12)
        if: ${{ !cancelled() }}
        run: node --test spec/webui/webui_workflow_classification_test.cjs
      - name: corrections pass specs (1844:RC8, 1844:RC4, 1853:RC9, 1846:RC4)
        if: ${{ !cancelled() }}
        run: bundle exec rspec spec/lib/common/script_scope_destroy_sibling_reads_spec.rb spec/lib/common/script_scope_model_coalescing_spec.rb spec/lib/common/script_scope_top_level_ivars_spec.rb spec/lib/common/script_scope_css_corpus_spec.rb
      - name: renderer fail-closed and password hint tests (1835:RC10, 1835:RC13)
        if: ${{ !cancelled() }}
        run: node --test spec/webui/webui_render_fail_closed_test.cjs spec/webui/webui_password_hints_test.cjs spec/webui/webui_asset_loading_test.cjs
