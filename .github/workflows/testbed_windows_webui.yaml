name: Windows Lich native gem repair

on:
  push:
    branches: ['testbed/webui-65175b76-20261111']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # An ineligible dispatch/re-run must not cancel an eligible owner's run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.actor_id }}-${{ github.triggering_actor }}
  cancel-in-progress: true

jobs:
  windows_webui:
    # Both the original actor and a re-run actor must be the authorized owner.
    # This guard runs before checkout; no PR code or external signal starts this job.
    if: >-
      github.repository == 'Lich5/lich-6' &&
      github.actor == 'OSXLich-Doug' && github.actor_id == '17682675' &&
      github.triggering_actor == 'OSXLich-Doug' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/testbed/webui-65175b76-20261111') ||
       github.event_name == 'workflow_dispatch')
    name: Ruby 4.0.9 without DevKit - real gem repair
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '4.0.9'
          windows-toolchain: none
          bundler: none
          bundler-cache: false
      - name: Record runner and candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tmp/windows-webui | Out-Null
          [ordered]@{
            sha = $env:GITHUB_SHA
            run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            attempt = $env:GITHUB_RUN_ATTEMPT
            os = $env:RUNNER_OS
            image = $env:ImageVersion
            ruby = (& ruby --version)
            devkit = $env:RI_DEVKIT
            gem_home = (& ruby -e 'puts Gem.dir')
          } | ConvertTo-Json | Set-Content tmp/windows-webui/runner.json
      - name: Start lich.rbw and accept its real gem repair dialog
        shell: pwsh
        run: ./.github/scripts/testbed_gem_repair.ps1
      - name: Upload Windows coverage and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-webui-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            tmp/windows-webui/
          if-no-files-found: warn
          retention-days: 14
