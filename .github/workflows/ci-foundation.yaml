name: CI Foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    name: CI foundation (${{ matrix.gtk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gtk: [without-gtk3, with-gtk3]
    env:
      BUNDLE_WITHOUT: ${{ matrix.gtk == 'without-gtk3' && 'gtk:vscode:profanity' || 'vscode:profanity' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Install GTK build prerequisites
        if: matrix.gtk == 'with-gtk3'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgirepository1.0-dev \
            libgtk-3-dev
      - uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1.315.0
        with:
          bundler-cache: true
      - name: Verify repository Ruby
        run: |
          ruby_version=$(tr -d '[:space:]' < .ruby-version)
          ruby_path=$(command -v ruby)
          echo "ruby_path=$ruby_path"
          ruby -e 'puts "ruby_version=#{RUBY_VERSION}"; abort unless RUBY_VERSION == ARGV.fetch(0)' "$ruby_version"
      - name: Verify GTK dependency configuration
        run: |
          if [[ "${{ matrix.gtk }}" == "without-gtk3" ]]; then
            bundle exec ruby -e 'abort "gtk3 is available in the GTK-free bundle" if Gem.loaded_specs.key?("gtk3")'
          else
            bundle exec ruby -e 'abort "gtk3 is missing from the GTK-present bundle" unless Gem.loaded_specs.key?("gtk3")'
          fi
      - name: Run RSpec
        run: bundle exec rspec
      - name: Verify D4 shim boundary
        run: ruby script/ci/check_shim_namespace.rb
      - name: Verify ASCII-only Ruby source
        run: bundle exec rubocop --only Custom/AsciiOnlySource
      - name: Verify security registration manifest
        run: ruby script/ci/check_security_manifest.rb .github/ci/security-test-manifest.json
      - name: Verify GTK-free startup modes
        if: matrix.gtk == 'without-gtk3'
        env:
          LICH_CI_ARTIFACT_DIR: ${{ runner.temp }}/gtk-free-startup-loads
        run: ruby script/ci/startup_load_check.rb
      - name: Upload startup load records
        if: always() && matrix.gtk == 'without-gtk3'
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: gtk-free-startup-loads
          path: ${{ runner.temp }}/gtk-free-startup-loads
          if-no-files-found: error
  rubocop:
    name: RuboCop CI foundation
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: gtk:vscode:profanity
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1.315.0
        with:
          bundler-cache: true
      - name: Verify repository Ruby
        run: |
          ruby_version=$(tr -d '[:space:]' < .ruby-version)
          ruby_path=$(command -v ruby)
          echo "ruby_path=$ruby_path"
          ruby -e 'puts "ruby_version=#{RUBY_VERSION}"; abort unless RUBY_VERSION == ARGV.fetch(0)' "$ruby_version"
      - name: Run RuboCop
        run: bundle exec rubocop
  security-registration:
    name: Security check registration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1.315.0
      - name: Verify repository Ruby
        run: |
          ruby_version=$(tr -d '[:space:]' < .ruby-version)
          ruby_path=$(command -v ruby)
          echo "ruby_path=$ruby_path"
          ruby -e 'puts "ruby_version=#{RUBY_VERSION}"; abort unless RUBY_VERSION == ARGV.fetch(0)' "$ruby_version"
      - name: Generate check-run payloads
        run: |
          ruby script/ci/check_security_manifest.rb .github/ci/security-test-manifest.json
          ruby script/ci/security_check_runs.rb .github/ci/security-test-manifest.json > "$RUNNER_TEMP/security-check-runs.json"
      - name: Validate and publish reserved check runs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const payloads = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/security-check-runs.json', 'utf8'));
            if (payloads.length !== 20) throw new Error('expected twenty check runs');
            const headSha = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.sha
              : context.sha;
            for (const payload of payloads) {
                await github.rest.checks.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head_sha: headSha,
                  name: payload.name,
                  status: 'completed',
                  conclusion: payload.conclusion,
                  output: { title: 'Security test registration', summary: 'SPEC-CI-FOUNDATION 1.4.0 registration.' }
                });
            }
